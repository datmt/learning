services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-perf-lab
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c log_min_duration_statement=500 -c log_line_prefix='%m [%p] %q%u@%d '
    environment:
      POSTGRES_DB: perf
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: perf_pw
    ports:
      - "5434:5432"
    volumes:
      - pg_perf_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf -d perf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_perf_data:
